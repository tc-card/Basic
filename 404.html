<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#09090b">
    <meta name="description" content="The requested Total Connect profile could not be found.">
    <link rel="icon" href="https://tccards.tn/Assets/150.png" type="image/png">
    <title>Profile Not Found | Total Connect</title>
    <style>
        :root {
            color-scheme: dark;
            --background: #09090b;
            --panel: rgba(24, 24, 27, 0.82);
            --border: rgba(255, 255, 255, 0.12);
            --muted: #a1a1aa;
            --text: #fafafa;
            --accent: #5eead4;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--text);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 15% 15%, rgba(20, 184, 166, 0.16), transparent 30%),
                radial-gradient(circle at 85% 85%, rgba(59, 130, 246, 0.14), transparent 30%),
                var(--background);
        }

        .error-panel {
            width: min(100%, 460px);
            padding: clamp(28px, 7vw, 56px);
            text-align: center;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(16px);
        }

        .error-code {
            margin: 0;
            color: var(--accent);
            font-size: clamp(4rem, 18vw, 7rem);
            line-height: 0.9;
            letter-spacing: 0.04em;
        }

        h1 {
            margin: 24px 0 12px;
            font-size: clamp(1.4rem, 5vw, 2rem);
        }

        p {
            margin: 0 auto 28px;
            max-width: 34ch;
            color: var(--muted);
            line-height: 1.6;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding: 0 18px;
            color: var(--background);
            font-weight: 700;
            text-decoration: none;
            background: var(--accent);
            border-radius: 8px;
        }

        a.secondary {
            color: var(--text);
            background: transparent;
            border: 1px solid var(--border);
        }

        a:hover { filter: brightness(1.08); }
        a:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    </style>
</head>
<body>
    <main class="error-panel" aria-labelledby="page-title">
        <p class="error-code" aria-hidden="true">404</p>
        <h1 id="page-title">Profile not found</h1>
        <p>The link may be incorrect, expired, or the profile may no longer be active.</p>
        <div class="actions">
            <a href="https://tccards.tn/">Visit Total Connect</a>
            <a class="secondary" href="javascript:history.back()" info="Go Back">Try again</a>
        </div>
    </main>
</body>
</html>
